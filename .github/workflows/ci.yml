name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run before it. Runs on main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    # Scans every commit for secrets (#351). Reviewed false positives live in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # A pull request cannot switch its own scan off: the list of reviewed false positives is
      # the one already on the branch it merges into, and the rules are gitleaks' defaults.
      - name: Use the allowlist from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ -e .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml is not allowed: the scan uses gitleaks' default rules."
            exit 1
          fi
          # The very first pull request (the one adding the file) has no base copy to use.
          if git cat-file -e "$BASE:.gitleaksignore" 2>/dev/null; then
            git show "$BASE:.gitleaksignore" > .gitleaksignore
          fi
      # Every commit reachable from this build, back to the first; no other branch.
      # --text reads files git would call binary; --ignore-gitleaks-allow ignores inline opt-outs.
      - run: ./gitleaks git --redact --no-banner --verbose --ignore-gitleaks-allow --log-opts="--text HEAD" .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real PostgreSQL for the database tests (issue #201). Synthetic data only.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invoice:invoice@localhost:5432/invoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify

  coverage:
    # How much of packages/* its own tests exercise (#354). Fails below the floor in package.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage | tee coverage.txt
      - name: Put the totals on the run's summary page
        if: always()
        run: |
          {
            echo '### Coverage of packages/*/src'
            echo '```'
            grep -E 'file +\| line %|all files' coverage.txt | sed 's/^. //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    # Builds the production image (#356). Until #356 adds a Dockerfile there is nothing to build,
    # and the job says so rather than passing silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Dockerfile') != ''
        run: docker build --tag invoice-product:ci .
      - if: hashFiles('Dockerfile') == ''
        run: echo "::warning title=No container built::There is no Dockerfile yet (issue 356), so this job built nothing."
