# Version updates (#351): weekly, minor and patch grouped so they do not swamp the review queue;
# a major version always arrives as its own pull request. Security updates are a separate
# repository setting ("Dependabot security updates"), not this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
