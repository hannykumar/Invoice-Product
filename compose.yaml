services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - invoice-postgres:/var/lib/postgresql/data

volumes:
  invoice-postgres:

