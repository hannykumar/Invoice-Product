<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Invoice Product development workspace" />
    <title>Karobar workspace</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip"></a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation" data-i18n-aria="primaryNavigation">
        <a class="brand" href="#dashboard" aria-label="Karobar home" data-i18n-aria="companyHome">
          <span class="brand-mark" aria-hidden="true">क</span>
          <span><strong>Karobar</strong><small data-i18n="brandSubtitle"></small></span>
        </a>
        <nav class="nav-list" aria-label="Workspace" data-i18n-aria="workspaceNavigation">
          <button class="nav-item active" data-view="dashboard"><span aria-hidden="true">⌂</span><span data-i18n="navHome"></span></button>
          <button class="nav-item" data-view="sale"><span aria-hidden="true">＋</span><span data-i18n="navSale"></span></button>
          <button class="nav-item" data-view="purchase"><span aria-hidden="true">↓</span><span data-i18n="navPurchase"></span></button>
          <button class="nav-item" data-view="payment"><span aria-hidden="true">₹</span><span data-i18n="navPayment"></span></button>
          <button class="nav-item" data-view="returns"><span aria-hidden="true">↩</span><span data-i18n="navReturns"></span></button>
          <button class="nav-item" data-view="deliveries"><span aria-hidden="true">⇄</span><span data-i18n="navDeliveries"></span></button>
          <button class="nav-item" data-view="supplier"><span aria-hidden="true">⚑</span><span data-i18n="navSupplier"></span></button>
          <button class="nav-item" data-view="einvoice"><span aria-hidden="true">✦</span><span data-i18n="navEInvoice"></span></button>
          <button class="nav-item" data-view="reminders"><span aria-hidden="true">⏰</span><span data-i18n="navReminders"></span></button>
          <button class="nav-item" data-view="activity"><span aria-hidden="true">◷</span><span data-i18n="navActivity"></span></button>
          <button class="nav-item" data-view="reports"><span aria-hidden="true">▤</span><span data-i18n="navReports"></span></button>
          <button class="nav-item" data-view="setup"><span aria-hidden="true">✦</span><span data-i18n="navSetup"></span></button>
          <button class="nav-item" data-view="migration"><span aria-hidden="true">⇪</span><span data-i18n="navMigration"></span></button>
          <button class="nav-item" data-view="ask"><span aria-hidden="true">?</span><span data-i18n="navAsk"></span></button>
        </nav>
        <div class="sidebar-note">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong data-i18n="deviceReady"></strong><small data-i18n="draftProtection"></small></div>
        </div>
      </aside>

      <header class="topbar">
        <button class="icon-button mobile-only" id="menu-button" aria-label="Open navigation" data-i18n-aria="menuOpen" aria-expanded="false">☰</button>
        <div class="company-switcher">
          <span class="company-avatar" id="company-avatar" aria-hidden="true">ST</span>
          <span><strong id="company-name">Sampoorna Traders</strong><small id="company-location">Bengaluru · Peenya godown</small></span>
        </div>
        <div class="topbar-actions">
          <label class="language-control">
            <span class="sr-only" data-i18n="language"></span>
            <select id="locale" aria-label="Language" data-i18n-aria="language">
              <option value="en-IN">English</option>
              <option value="hi-IN">हिन्दी</option>
            </select>
          </label>
          <button class="icon-button" aria-label="Notifications" data-i18n-aria="notifications">●</button>
          <button class="text-button" id="sign-out" type="button" data-i18n="signOut"></button>
          <span class="user-avatar" aria-label="Signed in as Hanny Kumar" data-i18n-aria="signedIn">HK</span>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div class="demo-banner" id="connection-banner" role="status">
          <span aria-hidden="true">◉</span>
          <span><strong data-i18n="demoTitle"></strong> <span data-i18n="demoBody"></span></span>
        </div>

        <section class="view active" id="view-dashboard" aria-labelledby="dashboard-title">
          <div class="page-heading">
            <div><p class="eyebrow" data-i18n="today"></p><h1 id="dashboard-title" tabindex="-1" data-i18n="welcome"></h1><p id="welcome-body" data-i18n="welcomeBody"></p></div>
            <button class="primary-button" data-open="sale"><span aria-hidden="true">＋</span><span data-i18n="newSale"></span></button>
          </div>

          <div class="metric-grid" aria-label="Business summary" data-i18n-aria="businessSummary">
            <article class="metric-card accent-green"><div class="metric-icon" aria-hidden="true">₹</div><p data-i18n="salesToday"></p><strong id="metric-sales">—</strong><small class="positive" data-i18n="salesFromModule"></small></article>
            <article class="metric-card accent-amber"><div class="metric-icon" aria-hidden="true">↗</div><p data-i18n="customersOwe"></p><strong id="metric-receivable">—</strong><small id="customer-summary" data-i18n="openSalesInvoices"></small></article>
            <article class="metric-card accent-blue"><div class="metric-icon" aria-hidden="true">▣</div><p data-i18n="purchasesMonth"></p><strong id="metric-purchases">—</strong><small id="supplier-summary" data-i18n="postedSupplierBills"></small></article>
            <article class="metric-card accent-red"><div class="metric-icon" aria-hidden="true">!</div><p data-i18n="needsAttention"></p><strong id="metric-attention">—</strong><small data-i18n="calculatedLive"></small></article>
          </div>

          <div class="dashboard-grid">
            <article class="panel activity-panel">
              <div class="panel-heading"><div><h2 data-i18n="recentActivity"></h2><p data-i18n="recentBody"></p></div><button class="text-button" data-open="activity" data-i18n="viewAll"></button></div>
              <div class="activity-list" id="recent-activity" aria-live="polite"><p class="loading-copy" data-i18n="loadingActivity"></p></div>
            </article>

            <aside class="panel attention-panel">
              <div class="panel-heading"><div><h2 data-i18n="yourAttention"></h2><p data-i18n="attentionHelp"></p></div></div>
              <div class="attention-item"><span class="attention-symbol green" aria-hidden="true">▦</span><span><strong id="stock-title" data-i18n="loadingStock"></strong><small id="stock-detail" data-i18n="readingInventory"></small></span></div>
              <div class="attention-item"><span class="attention-symbol amber" aria-hidden="true">₹</span><span><strong id="supplier-title" data-i18n="loadingSupplier"></strong><small id="supplier-detail" data-i18n="readingReceivables"></small></span></div>
            </aside>
          </div>
        </section>

        <section class="view" id="view-sale" aria-labelledby="sale-title">
          <div class="page-heading compact"><div><p class="eyebrow" data-i18n="stepOne"></p><h1 id="sale-title" tabindex="-1" data-i18n="saleTitle"></h1><p data-i18n="saleHelp"></p></div><span class="save-state" id="sale-save-state" role="status" data-i18n="savedDevice"></span></div>
          <form class="transaction-layout draft-form" data-draft="sale">
            <article class="panel form-panel">
              <div class="field-grid">
                <label><span data-i18n="customer"></span><input name="party" autocomplete="organization" data-i18n-placeholder="saleCustomerPlaceholder" required /></label>
                <label><span data-i18n="date"></span><input name="date" type="date" required /></label>
                <label><span data-i18n="item"></span><input name="item" data-i18n-placeholder="saleItemPlaceholder" required /></label>
                <label><span data-i18n="quantity"></span><span class="input-with-suffix"><input name="quantity" type="number" min="0.001" step="0.001" value="1" required /><span data-i18n="boxes"></span></span></label>
                <label><span data-i18n="rate"></span><span class="input-with-prefix"><span>₹</span><input name="rate" type="number" min="0" step="0.01" value="0" required /></span></label>
                <label><span data-i18n="paymentTerms"></span><select name="terms"><option value="now" data-i18n="payNow"></option><option value="7" data-i18n="sevenDays"></option><option value="30" data-i18n="thirtyDays"></option></select></label>
              </div>
              <details><summary data-i18n="moreDetails"></summary><div class="field-grid extra-fields"><label><span data-i18n="reference"></span><input name="reference" /></label><label><span data-i18n="notes"></span><textarea name="notes" rows="3"></textarea></label></div></details>
            </article>
            <aside class="panel summary-card"><h2 data-i18n="saleSummary"></h2><div class="summary-line"><span data-i18n="itemTotal"></span><strong data-calculated="subtotal">₹0.00</strong></div><div class="summary-line"><span data-i18n="gstEstimate"></span><strong data-calculated="tax">—</strong></div><div class="summary-total"><span data-i18n="amountCustomerPays"></span><strong data-calculated="total">—</strong></div><p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="taxSafety"></span></p><button type="submit" class="primary-button wide" data-i18n="reviewSale"></button><button type="button" class="secondary-button wide clear-draft" data-i18n="discardDraft"></button></aside>
          </form>
        </section>

        <section class="view" id="view-purchase" aria-labelledby="purchase-title">
          <div class="page-heading compact"><div><p class="eyebrow" data-i18n="stepOne"></p><h1 id="purchase-title" tabindex="-1" data-i18n="purchaseTitle"></h1><p data-i18n="purchaseHelp"></p></div><span class="save-state" id="purchase-save-state" role="status" data-i18n="savedDevice"></span></div>
          <form class="transaction-layout draft-form" data-draft="purchase">
            <article class="panel form-panel"><div class="field-grid"><label><span data-i18n="supplier"></span><input name="party" data-i18n-placeholder="supplierPlaceholder" required /></label><label><span data-i18n="supplierBill"></span><input name="reference" data-i18n-placeholder="supplierBillPlaceholder" required /></label><label><span data-i18n="billDate"></span><input name="date" type="date" required /></label><label><span data-i18n="billAmount"></span><span class="input-with-prefix"><span>₹</span><input name="amount" type="number" min="0" step="0.01" /></span><small data-i18n="billAmountHelp"></small></label><label><span data-i18n="whatYouBought"></span><select name="item"><option value="TMT12" data-i18n="itemSteel"></option><option value="SOAP" data-i18n="itemSoap"></option><option value="FRT" data-i18n="itemFreight"></option></select></label><label><span data-i18n="howMany"></span><input name="quantity" type="number" min="0" step="0.001" value="500" required /></label><label><span data-i18n="ratePerUnit"></span><span class="input-with-prefix"><span>₹</span><input name="rate" type="number" min="0" step="0.01" value="64" required /></span></label><label><span data-i18n="gstRate"></span><select name="gst"><option value="0">0%</option><option value="500">5%</option><option value="1200">12%</option><option value="1800" selected>18%</option><option value="2800">28%</option></select></label><label><span data-i18n="supplierState"></span><select name="supplierState"><option value="other" data-i18n="stateOther"></option><option value="same" data-i18n="stateSame"></option></select><small data-i18n="supplierStateHelp"></small></label><label class="full-field"><span data-i18n="uploadBill"></span><input name="attachment" type="file" accept="image/*,.pdf" /><small data-i18n="uploadHelp"></small></label></div></article>
            <aside class="panel summary-card"><h2 data-i18n="beforeSaving"></h2><ol class="check-list"><li data-i18n="checkSupplier"></li><li data-i18n="checkDuplicate"></li><li data-i18n="checkTax"></li></ol><p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="purchaseSafety"></span></p><h2 data-i18n="postingTitle"></h2><ol class="check-list"><li data-i18n="postingStock"></li><li data-i18n="postingBooks"></li><li data-i18n="postingOwed"></li></ol><p class="safety-note"><span aria-hidden="true">◎</span><span data-i18n="postingTogether"></span></p><p class="safety-note"><span aria-hidden="true">↻</span><span data-i18n="postingRetrySafe"></span></p><button type="submit" class="primary-button wide" data-i18n="reviewPurchase"></button><button type="button" class="secondary-button wide clear-draft" data-i18n="discardDraft"></button></aside>
          </form>
        </section>

        <section class="view" id="view-payment" aria-labelledby="payment-title">
          <div class="page-heading compact"><div><p class="eyebrow" data-i18n="stepOne"></p><h1 id="payment-title" tabindex="-1" data-i18n="paymentTitle"></h1><p data-i18n="paymentHelp"></p></div><span class="save-state" id="payment-save-state" role="status" data-i18n="savedDevice"></span></div>
          <form class="transaction-layout draft-form" data-draft="payment">
            <article class="panel form-panel"><div class="field-grid"><label><span data-i18n="receivedFrom"></span><input name="party" data-i18n-placeholder="paymentCustomerPlaceholder" required /></label><label><span data-i18n="amountReceived"></span><span class="input-with-prefix"><span>₹</span><input name="amount" type="number" min="0.01" step="0.01" required /></span></label><label><span data-i18n="paymentDate"></span><input name="date" type="date" required /></label><label><span data-i18n="paymentMethod"></span><select name="method"><option>UPI</option><option data-i18n="cash"></option><option data-i18n="bankTransfer"></option><option data-i18n="cheque"></option></select></label><label class="full-field"><span data-i18n="chooseBill"></span><select name="invoice" id="payment-invoice"><option value="" data-i18n="chooseLater"></option></select><small data-i18n="chooseBillHelp"></small></label></div></article>
            <aside class="panel summary-card"><h2 data-i18n="paymentSummary"></h2><div class="summary-total"><span data-i18n="amountReceived"></span><strong data-payment-total>₹0.00</strong></div><p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="paymentSafety"></span></p><button type="submit" class="primary-button wide" data-i18n="reviewPayment"></button><button type="button" class="secondary-button wide clear-draft" data-i18n="discardDraft"></button></aside>
          </form>
        </section>

        <section class="view" id="view-returns" aria-labelledby="returns-title">
          <div class="page-heading compact"><div><p class="eyebrow" data-i18n="workspace"></p><h1 id="returns-title" tabindex="-1" data-i18n="returnsTitle"></h1><p data-i18n="returnsHelp"></p></div></div>
          <form class="transaction-layout" id="return-form">
            <article class="panel form-panel">
              <div class="field-grid">
                <label class="full-field"><span data-i18n="originalBill"></span><select name="documentId" id="return-document" required></select></label>
                <label class="full-field"><span data-i18n="returnItem"></span><select name="lineId" id="return-line" required></select><small id="return-remaining" data-i18n="returnRemaining"></small></label>
                <input name="kind" id="return-kind" type="hidden" />
                <input name="unit" id="return-unit" type="hidden" />
                <label><span data-i18n="returnQuantity"></span><input name="quantity" type="number" min="0.000001" step="0.000001" required /></label>
                <label><span data-i18n="disposition"></span><select name="disposition"><option value="ACCEPTED" data-i18n="dispAccepted"></option><option value="DAMAGED" data-i18n="dispDamaged"></option><option value="SCRAPPED" data-i18n="dispScrapped"></option><option value="REPLACEMENT" data-i18n="dispReplacement"></option></select></label>
                <label><span data-i18n="returnDate"></span><input name="date" type="date" required /></label>
                <label><span data-i18n="returnReference"></span><input name="reference" required /></label>
                <label class="full-field"><span data-i18n="returnReason"></span><textarea name="reason" rows="3" required></textarea><small data-i18n="returnReasonHelp"></small></label>
              </div>
            </article>
            <aside class="panel summary-card">
              <h2 data-i18n="beforeSaving"></h2>
              <ol class="check-list"><li data-i18n="returnCheckQuantity"></li><li data-i18n="returnCheckBooks"></li><li data-i18n="returnCheckCompliance"></li></ol>
              <p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="returnSafety"></span></p>
              <button type="submit" class="primary-button wide" data-i18n="checkReturn"></button>
            </aside>
          </form>
        </section>

        <section class="view" id="view-einvoice" aria-labelledby="einvoice-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow" data-i18n="workspace"></p>
              <h1 id="einvoice-title" tabindex="-1" data-i18n="einvoiceTitle"></h1>
              <p data-i18n="einvoiceHelp"></p>
            </div>
          </div>

          <article class="panel form-panel">
            <form id="einvoice-form">
              <div class="field-grid">
                <label class="full-field"><span data-i18n="whichBill"></span><select name="invoice" id="einvoice-invoices" required></select></label>
                <label><span data-i18n="yourTurnover"></span><span class="input-with-prefix"><span>₹</span><input name="turnover" type="number" min="0" step="1" placeholder="80000000" /></span><small data-i18n="turnoverHelp"></small></label>
                <label><span data-i18n="exemptCategory"></span><select name="exempt"><option value="" data-i18n="notExempt"></option><option value="BANKING_OR_NBFC" data-i18n="exemptBank"></option><option value="GOODS_TRANSPORT_AGENCY" data-i18n="exemptGta"></option><option value="SEZ_UNIT" data-i18n="exemptSez"></option></select></label>
              </div>
              <button type="submit" class="primary-button wide" data-i18n="checkNeeded"></button>
              <p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="einvoiceSafety"></span></p>
            </form>
          </article>

          <article class="panel" id="einvoice-panel" hidden>
            <div class="panel-heading">
              <div><h2 id="einvoice-result-title">—</h2><p id="einvoice-result-message"></p></div>
              <span class="pill" id="einvoice-status">—</span>
            </div>
            <div class="activity-list" id="einvoice-detail"></div>
            <div class="dialog-actions" id="einvoice-actions">
              <button type="button" class="primary-button" id="einvoice-send" hidden data-i18n="sendToGovernment"></button>
              <button type="button" class="secondary-button" id="einvoice-offline" hidden data-i18n="downloadOffline"></button>
              <button type="button" class="secondary-button" id="einvoice-reconcile" hidden data-i18n="askGovernment"></button>
            </div>
            <form id="einvoice-cancel-form" hidden>
              <div class="field-grid">
                <label><span data-i18n="cancelReasonKind"></span><select name="reasonCode"><option value="DATA_ENTRY_MISTAKE" data-i18n="reasonMistake"></option><option value="DUPLICATE" data-i18n="reasonDuplicate"></option><option value="ORDER_CANCELLED" data-i18n="reasonOrderOff"></option><option value="OTHER" data-i18n="reasonOther"></option></select></label>
                <label><span data-i18n="cancelReasonWhy"></span><input name="reason" placeholder="The buyer's GST number was typed wrong" required /></label>
              </div>
              <button type="submit" class="secondary-button wide" data-i18n="cancelEInvoice"></button>
            </form>
          </article>
        </section>

        <section class="view" id="view-supplier" aria-labelledby="supplier-check-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow" data-i18n="workspace"></p>
              <h1 id="supplier-check-title" tabindex="-1" data-i18n="supplierTitle"></h1>
              <p data-i18n="supplierHelp"></p>
            </div>
          </div>

          <article class="panel form-panel">
            <form id="supplier-form">
              <div class="field-grid">
                <label><span data-i18n="supplier"></span><input name="party" value="Deccan Hardware Traders" required /></label>
                <label><span data-i18n="theirGstin"></span><input name="gstin" value="29AAFCD1234K1ZN" required /><small data-i18n="theirGstinHelp"></small></label>
                <label class="full-field"><span data-i18n="trySomeone"></span><select id="supplier-choices"><option value="" data-i18n="chooseLater"></option></select></label>
                <label><span data-i18n="supplierBill"></span><input name="reference" value="DHW/2026/114" /></label>
                <label><span data-i18n="billDate"></span><input name="date" type="date" value="2026-07-04" /></label>
              </div>
              <button type="submit" class="primary-button wide" data-i18n="checkSupplier"></button>
              <p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="supplierSafety"></span></p>
            </form>
          </article>

          <article class="panel" id="supplier-panel" hidden>
            <div class="panel-heading">
              <div><h2 id="supplier-result-title">—</h2><p id="supplier-result-message"></p></div>
              <span class="pill" id="supplier-level">—</span>
            </div>
            <div class="light-row" id="supplier-lights" aria-live="polite"></div>
            <h3 data-i18n="whatWeFound"></h3>
            <div id="supplier-warnings" class="activity-list"></div>
            <h3 data-i18n="whereFrom"></h3>
            <div id="supplier-sources" class="activity-list"></div>
            <form id="supplier-ack-form" hidden>
              <div class="field-grid"><label class="full-field"><span data-i18n="ackReason"></span><input name="reason" placeholder="Spoke to the owner; they are re-registering" required /></label></div>
              <button type="submit" class="secondary-button wide" data-i18n="ackButton"></button>
            </form>
          </article>
        </section>


        <!-- Issue #23 [E23]: chasing overdue money. Every row is decided from the receivables
             position at the moment the page loaded, and a skip is shown as prominently as a send. -->
        <section class="view" id="view-reminders" aria-labelledby="reminders-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow" data-i18n="workspace"></p>
              <h1 id="reminders-title" tabindex="-1" data-i18n="remindersTitle"></h1>
              <p data-i18n="remindersHelp"></p>
            </div>
          </div>

          <article class="panel">
            <div class="panel-heading">
              <div><h2 data-i18n="remindersToday"></h2><p id="reminders-summary">—</p></div>
              <button type="button" class="primary-button" id="reminders-send-all" data-i18n="remindersSendAll"></button>
            </div>
            <div id="reminders-plan" class="activity-list" aria-live="polite"></div>
            <p class="safety-note"><span aria-hidden="true">i</span><span data-i18n="remindersSafety"></span></p>
          </article>

          <article class="panel form-panel">
            <h2 data-i18n="remindersTellUs"></h2>
            <form id="reminders-note-form">
              <div class="field-grid">
                <label class="full-field"><span data-i18n="remindersBill"></span><select name="documentId" id="reminders-bill-choices"></select></label>
                <label><span data-i18n="remindersWhatHappened"></span><select name="kind" id="reminders-kind">
                  <option value="promise" data-i18n="remindersPromise"></option>
                  <option value="dispute" data-i18n="remindersDispute"></option>
                </select></label>
                <label><span data-i18n="remindersPromisedOn"></span><input name="promisedOn" type="date" value="2026-09-05" /></label>
                <label><span data-i18n="remindersAmount"></span><input name="amount" type="text" inputmode="decimal" value="250" /></label>
                <label class="full-field"><span data-i18n="remindersNote"></span><input name="note" placeholder="Owner said the cheque goes out on Tuesday" /></label>
              </div>
              <button type="submit" class="secondary-button wide" data-i18n="remindersRecord"></button>
            </form>
            <div id="reminders-promises" class="activity-list"></div>
          </article>

          <article class="panel form-panel">
            <h2 data-i18n="remindersStopTitle"></h2>
            <form id="reminders-stop-form">
              <div class="field-grid">
                <label class="full-field"><span data-i18n="remindersStopReason"></span><input name="reason" placeholder="They asked us to call instead of messaging" required /></label>
              </div>
              <button type="submit" class="secondary-button" data-i18n="remindersStop"></button>
